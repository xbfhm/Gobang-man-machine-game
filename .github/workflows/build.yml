name: Build APK (Android 16)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # ubuntu-22.04：buildozer / python-for-android 官方验证过的系统
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 释放磁盘空间（dotnet / 预装安卓SDK / ghc 等都很占空间）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-virtualenv \
            build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext ccache

      - name: Cache buildozer global directory
        uses: actions/cache@v6
        with:
          path: ~/.buildozer/cache
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "buildozer>=1.5.0" "cython>=0.29.1,<=3.0.12"

      - name: Clean previous buildozer artifacts
        run: rm -rf .buildozer/

      - name: Build debug APK (targetSdk 36 / NDK 28c / arm64-v8a)
        run: |
          set -o pipefail
          export APP_ALLOW_MISSING_DEPS=true
          # buildozer.spec 中 p4a.branch = develop（python-for-android 开发分支，含 16KB 修复）
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Verify 16KB page size alignment
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "APK: $APK"
          mkdir -p /tmp/apk
          unzip -q "$APK" -d /tmp/apk
          NDK=$(ls -d ~/.buildozer/android/platform/android-ndk-* 2>/dev/null | head -1)
          echo "NDK: $NDK"
          if [ -n "$NDK" ]; then
            READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            for so in /tmp/apk/lib/arm64-v8a/*.so; do
              echo "== $(basename $so) =="
              "$READELF" -l "$so" 2>/dev/null | awk '/LOAD/ {print $NF}' | sort -u
            done
          fi
          echo "16KB alignment check done (align 2**14 = 16384 means OK)"

      - name: Locate and copy APKs
        run: |
          mkdir -p artifact
          cp bin/*.apk artifact/ 2>/dev/null || true
          ls -la artifact/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gomoku16-apk
          path: artifact/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore
