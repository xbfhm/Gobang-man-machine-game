name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake autopoint gettext

      - name: Install buildozer and cython
        run: |
          pip3 install --upgrade buildozer cython==0.29.33

      - name: Build APK (fix SDK license issue)
        run: |
          buildozer -v android debug || true
          SDK_PATH=~/.buildozer/android/platform/android-sdk
          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-apk
          path: bin/*.apk
