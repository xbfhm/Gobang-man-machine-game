name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip python3-virtualenv \
            build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext ccache

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip setuptools
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Ensure Android SDK license auto-accept is enabled
        run: |
          if grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo 'android.accept_sdk_license = True' >> buildozer.spec
          fi

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Locate and copy APKs
        run: |
          mkdir -p bin
          find . -name "*.apk" ! -path "./bin/*" -exec cp {} bin/ \;
          ls -la bin/
          if [ -z "$(ls -A bin/ 2>/dev/null)" ]; then
            echo "::error::buildozer 没有生成任何 .apk 文件,构建实际失败,请查看 build_log.txt"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-apk
          path: bin/*.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
