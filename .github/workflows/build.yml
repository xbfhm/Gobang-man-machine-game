Name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake autopoint gettext

      # 锁定 buildozer 1.5.0 和 cython
      - name: Install buildozer and cython
        run: |
          pip3 install buildozer==1.5.0 cython==0.29.33

      # 自动接受 Android SDK 许可证
      - name: Accept Android SDK Licenses
        run: |
          # 触发 buildozer 下载 SDK 基础环境
          buildozer android showsdkversion || true
          
          # 强行接受 SDK 目录下所有 license 协议
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-apk
          path: bin/*.apk
